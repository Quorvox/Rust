[package]
name = "winlite-tuner"
version = "0.1.0"
edition = "2024"
description = "Reversible Windows telemetry tweaks with backup, dry-run and revert"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
